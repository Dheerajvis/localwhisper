name: Build and Release LocalWhisper

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Application
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Windows Executable with PyInstaller
        run: |
          pyinstaller --noconfirm localwhisper.spec

      - name: Package Windows Binary
        shell: bash
        run: |
          cd dist
          7z a -tzip ../LocalWhisper-Windows-x64.zip LocalWhisper/*
          cd ..

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalWhisper-Windows-x64
          path: LocalWhisper-Windows-x64.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LocalWhisper-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS Apple Silicon Application
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build macOS App with PyInstaller
        run: |
          pyinstaller --noconfirm localwhisper.spec
          codesign --force --deep --sign - dist/LocalWhisper.app

      - name: Package macOS App
        run: |
          cd dist
          zip -r -y -q ../LocalWhisper-macOS-arm64.zip LocalWhisper.app
          cd ..

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalWhisper-macOS-arm64
          path: LocalWhisper-macOS-arm64.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LocalWhisper-macOS-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

