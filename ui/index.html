<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalWhisper Pill</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="pill-wrapper">
    <!-- Shortcut Key Hint Above Floating Pill -->
    <div class="shortcut-hint" id="shortcutHint" title="Global Shortcut: Right Option">
      <span class="hint-keys" id="hintKeys">
        <kbd class="hint-kbd">Right ⌥</kbd>
      </span>
    </div>

    <!-- Ultra-Minimal Floating Pill (Static & Active States) -->
    <div class="minimal-pill idle" id="pill" title="Click to Record (Right ⌥)">
      
      <!-- Left: 6-Dot Drag Grip -->
      <div class="drag-grip" id="dragGrip" title="Drag to Move">
        <span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span>
      </div>

      <!-- Center: Audio Waveform / Logo Box -->
      <div class="waveform-box" id="waveformBox">
        <!-- Static State: Branded App Logo with Soft Ambient Mint Glow -->
        <div class="static-waveform" id="staticWaveform">
          <div class="static-glow"></div>
          <img src="logo.png" alt="LocalWhisper" class="static-logo-img">
        </div>

        <!-- Active State: Vibrant Colorful Spectrum Waveform -->
        <div class="active-waveform" id="activeWaveform">
          <div class="spectrum-glow"></div>
          <span class="spectrum-bar" style="--c: #F59E0B; --bh: 18px; --d: 0.0s;"></span>
          <span class="spectrum-bar" style="--c: #F97316; --bh: 14px; --d: 0.12s;"></span>
          <span class="spectrum-bar" style="--c: #FB923C; --bh: 22px; --d: 0.24s;"></span>
          <span class="spectrum-bar" style="--c: #FBBF24; --bh: 16px; --d: 0.08s;"></span>
          <span class="spectrum-bar" style="--c: #EAB308; --bh: 24px; --d: 0.32s;"></span>
          <span class="spectrum-bar" style="--c: #84CC16; --bh: 20px; --d: 0.16s;"></span>
          <span class="spectrum-bar" style="--c: #22C55E; --bh: 26px; --d: 0.40s;"></span>
          <span class="spectrum-bar" style="--c: #14B8A6; --bh: 18px; --d: 0.28s;"></span>
          <span class="spectrum-bar" style="--c: #06B6D4; --bh: 24px; --d: 0.18s;"></span>
          <span class="spectrum-bar" style="--c: #0EA5E9; --bh: 16px; --d: 0.36s;"></span>
          <span class="spectrum-bar" style="--c: #3B82F6; --bh: 22px; --d: 0.22s;"></span>
          <span class="spectrum-bar" style="--c: #60A5FA; --bh: 14px; --d: 0.44s;"></span>
        </div>
      </div>

      <!-- Right: Circular Settings Button -->
      <button class="settings-circle-btn" id="settingsBtn" title="Settings & AI Models">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.2"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>

    </div>

    <!-- Mini Right-Click Context Menu -->
    <div class="mini-context-menu" id="contextMenu">
      <div class="context-item" id="menuSettings">⚙️ Open Settings</div>
      <div class="context-divider"></div>
      <div class="context-item quit-item" id="menuQuit">✕ Quit LocalWhisper</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
